[project]
name = "mementomori"
version = "0.1.0"
description = "Plateforme de connaissance multi-projets auto-hebergee."
authors = [
    {name = "Therealcorwin"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C90", "ANN", "RUF"]
ignore = ["S101", "E501", "N999", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
exclude = [".venv"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]