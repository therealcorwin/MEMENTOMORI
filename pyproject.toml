[project]
name = "mementomori"
version = "0.1.0"
description = "Plateforme de connaissance multi-projets auto-hebergee."
authors = [
    {name = "Therealcorwin"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi (>=0.142.2,<0.143.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "pydantic (>=2.13.5,<3.0.0)", "pydantic-settings (>=2.15.0,<3.0.0)", "structlog (>=26.1.0,<27.0.0)", "python-dotenv (>=1.2.4,<2.0.0)", "httpx (>=0.28.1,<0.29.0)", "sqlalchemy (>=2.1.3,<3.0.0)", "pgvector (>=0.5.0,<0.6.0)", "asyncpg (>=0.31.0,<0.32.0)", "redis (<6.0.0)", "arq (>=0.28.0,<0.29.0)", "google-genai (>=2.28.0,<3.0.0)", "pyjwt[crypto] (>=2.15.1,<3.0.0)", "pytest (>=9.1.1,<10.0.0)", "pytest-asyncio (>=1.4.0,<2.0.0)", "greenlet (>=3.5.6,<4.0.0)", "prometheus-client (>=0.26.0,<0.27.0)", "pymysql (>=1.2.3,<2.0.0)", "aiomysql (>=0.3.2,<0.4.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C90", "ANN", "RUF"]
ignore = ["S101", "E501", "N999", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
exclude = [".venv"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.skylos]
# Exemption pour le montage du socket Docker hôte requis par Traefik et Promtail (SKY-D331)
# Exemption de complexité cyclomatique / cognitive et métriques de code (SKY-Q301, SKY-Q306, SKY-C304, SKY-Q502, SKY-L004)
ignore = [
    "SKY-D331",
    "SKY-Q301",
    "SKY-Q306",
    "SKY-C304",
    "SKY-Q502",
    "SKY-L004"
]
exclude = ["scripts", ".env"]

[tool.skylos.gate]
fail_on_critical = true
max_critical = 0
max_high = 5
max_security = 10
max_reliability = 10
max_quality = 500
max_secrets = 0
