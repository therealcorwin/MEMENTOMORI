# ==============================================================================
# docker-compose.dev.yml - Environnement de développement local (Sprint 1+)
# ==============================================================================
# Usage :
#   docker compose -f docker-compose.dev.yml up -d knowledge-db knowledge-redis
#   docker compose -f docker-compose.dev.yml up -d (lance le socle dev complet)
# ==============================================================================

services:
  # ========== BASE KNOWLEDGE (PostgreSQL 16 + pgvector) ==========
  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: mementomori-knowledge-db
    restart: unless-stopped
    ports:
      # Expose sur 5433 pour éviter tout conflit éventuel avec un PostgreSQL local existant
      - "5433:5432"
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge_app
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-dev_knowledge_password}
    volumes:
      - dev_knowledge_pgdata:/var/lib/postgresql/data
      - ./sql/init_knowledge.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_app -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dev_network
      - shared_network

  # ========== REDIS (Queue & Cache) ==========
  knowledge-redis:
    image: redis:7-alpine
    container_name: mementomori-knowledge-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - dev_knowledge_redis_data:/data
    networks:
      - dev_network

  # ========== AUTHENTIK (Socle Auth Dev) ==========
  authentik-db:
    image: postgres:16-alpine
    container_name: mementomori-authentik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-dev_authentik_db_password}
    volumes:
      - dev_authentik_pgdata:/var/lib/postgresql/data
    networks:
      - dev_network
      - shared_network

  authentik-redis:
    image: redis:7-alpine
    container_name: mementomori-authentik-redis
    restart: unless-stopped
    volumes:
      - dev_authentik_redis_data:/data
    networks:
      - dev_network

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2
    container_name: mementomori-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev_authentik_secret_key_needs_to_be_long_enough_for_security}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-dev_authentik_db_password}
    ports:
      - "9000:9000"
      - "9444:9443"
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - dev_network

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2
    container_name: mementomori-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev_authentik_secret_key_needs_to_be_long_enough_for_security}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-dev_authentik_db_password}
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - dev_network

networks:
  dev_network:
    name: mementomori_dev_network
  shared_network:
    name: Shared_Network
    external: true

volumes:
  dev_knowledge_pgdata:
  dev_knowledge_redis_data:
  dev_authentik_pgdata:
  dev_authentik_redis_data:

