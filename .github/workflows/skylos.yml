name: Skylos Security & Quality Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skylos-audit:
    name: Audit de sécurité et qualité du code (Skylos)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout du code source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurer Python 3.12 (environnement Skylos)
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer Skylos
        run: |
          python -m pip install --upgrade pip
          pip install skylos

      - name: Exécuter le scan Skylos
        id: skylos_scan
        run: |
          set -o pipefail
          # Scan complet (-a) avec Quality Gate (--gate), résumé Markdown (--summary) et annotations PR (--github)
          skylos . -a --gate --summary --github 2>&1 | tee skylos_report.txt
        continue-on-error: true

      - name: Publier le résumé d'exécution dans GitHub
        if: always()
        run: |
          echo "## 🛡️ Résumé de l'audit Skylos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.skylos_scan.outcome }}" = "success" ]; then
            echo "✅ **Statut** : Audit réussi — Le Quality Gate Skylos est validé." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Statut** : Échec de l'audit — Des problèmes bloquants ont été détectés par le Quality Gate." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Détails de l'analyse (Options : \`-a\`, \`--gate\`, \`--summary\`, \`--github\`)" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>👉 Cliquer pour afficher le rapport textuel brut</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f skylos_report.txt ]; then
            cat skylos_report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Aucun rapport généré." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Statut final de la CI
        if: steps.skylos_scan.outcome != 'success'
        run: |
          echo "::error::Le scan Skylos a échoué sur le Quality Gate (vulnérabilités critiques ou secrets détectés)."
          exit 1

