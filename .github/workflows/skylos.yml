name: Skylos Security & Quality Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  skylos-audit:
    name: Audit de sécurité et qualité du code (Skylos)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configurer Python 3.12 (environnement Skylos)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer Skylos
        run: |
          python -m pip install --upgrade pip
          pip install skylos

      - name: Exécuter le scan Skylos
        id: skylos_scan
        run: |
          set -o pipefail
          # Scan complet (-a) avec blocage sur vulnérabilités critiques (--fail-on critical)
          skylos . -a --fail-on critical 2>&1 | tee skylos_report.txt
        continue-on-error: true

      - name: Publier le résumé d'exécution dans GitHub
        if: always()
        run: |
          echo "## 🛡️ Résumé de l'audit Skylos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.skylos_scan.outcome }}" = "success" ]; then
            echo "✅ **Statut** : Audit réussi — Aucune vulnérabilité critique détectée." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Statut** : Échec de l'audit — Des vulnérabilités critiques ont été détectées." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Détails de l'analyse (Options : \`-a\`, \`--fail-on critical\`)" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>👉 Cliquer pour afficher le rapport complet</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f skylos_report.txt ]; then
            cat skylos_report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Aucun rapport généré." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Statut final de la CI
        if: steps.skylos_scan.outcome != 'success'
        run: |
          echo "::error::Le scan Skylos a détecté des vulnérabilités critiques bloquantes."
          exit 1
